<script id="data" type="application/json">{"lessons": {"en": [{"title": "Meet your game", "label": "FOUNDATIONS", "subtitle": "One button. One currency. Two ways to grow.", "body": "\n\u003cp class=\"lead\">Create \u003cstrong>Coin Lab\u003c/strong> using plain HTML, CSS, and JavaScript. Play the reference while you learn. TypeScript appears as an optional comparison, without a local installation.\u003c/p>\n\u003cdiv class=\"concept-grid\">\u003carticle>\u003cspan class=\"mini-tag\">HTML\u003c/span>\u003ch3>The structure\u003c/h3>\u003cp>Creates counters, buttons, and the shop.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"mini-tag\">CSS\u003c/span>\u003ch3>The appearance\u003c/h3>\u003cp>Controls colors, spacing, and layout.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"mini-tag\">JS / TS\u003c/span>\u003ch3>The behavior\u003c/h3>\u003cp>Tracks coins, clicks, and upgrades.\u003c/p>\u003c/article>\u003c/div>\n\u003ch2>The rules you will code\u003c/h2>\u003col>\u003cli>Start at \u003cstrong>0 coins\u003c/strong>. A click earns \u003cstrong>1 coin\u003c/strong>.\u003c/li>\u003cli>The first click upgrade costs \u003cstrong>10 coins\u003c/strong> and adds \u003cstrong>+1 coin per click\u003c/strong>.\u003c/li>\u003cli>The first auto-clicker costs \u003cstrong>25 coins\u003c/strong> and adds \u003cstrong>+1 coin per second\u003c/strong>.\u003c/li>\u003cli>Prices rise with each upgrade. You can buy only what you can afford.\u003c/li>\u003c/ol>\n\u003cdiv class=\"try\">\u003cspan>TRY IT\u003c/span>\u003cp>Click 10 times. Buy \u003cstrong>Stronger clicks\u003c/strong>. The next click earns 2 coins. Switch language above: the balance stays the same.\u003c/p>\u003c/div>\n\u003ch2>The simple workflow\u003c/h2>\u003cp>Edit \u003ccode>index.html\u003c/code>, \u003ccode>style.css\u003c/code>, and \u003ccode>main.js\u003c/code> in one folder. HTML loads the CSS and script directly. Save, open \u003ccode>index.html\u003c/code>, and refresh after edits.\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>Remember\u003c/strong>\u003cp>There is no terminal, package install, or build command. Browsers run JavaScript; they cannot directly run TypeScript type annotations. The optional TypeScript lesson shows the difference.\u003c/p>\u003c/div>\n\u003cp>Want a single file to share? Lesson 7 shows how to put the CSS and JavaScript inside one HTML file.\u003c/p>\u003cp class=\"muted\">About 45–75 minutes · beginner friendly · works offline · 8 lessons\u003c/p>\n"}, {"title": "Set up basic HTML", "label": "YOUR WORKSPACE", "subtitle": "Three files. One folder. Open in your browser.", "body": "\n\u003ch2>1. Create your folder\u003c/h2>\u003cp>Create a folder named \u003ccode>coin-lab\u003c/code> in Windows. Open it in VS Code with \u003cstrong>File → Open Folder\u003c/strong>. No terminal is needed.\u003c/p>\n\u003ch2>2. Create three files\u003c/h2>\u003cdiv class=\"file-list\">\u003cdiv>\u003ccode>index.html\u003c/code>\u003cspan>Page structure and file links\u003c/span>\u003c/div>\u003cdiv>\u003ccode>style.css\u003c/code>\u003cspan>Colors and layout\u003c/span>\u003c/div>\u003cdiv>\u003ccode>main.js\u003c/code>\u003cspan>Game logic\u003c/span>\u003c/div>\u003c/div>\n\u003cp>Copy the complete files from \u003cstrong>Under the hood\u003c/strong> below, or download the working reference ZIP, choose \u003cstrong>Extract All\u003c/strong>, and open the extracted folder.\u003c/p>\u003cbutton class=\"primary\" data-download=\"zip\">Download source ZIP ↓\u003c/button>\n\u003ch2>3. Link your CSS and script\u003c/h2>\u003cp>Inside the HTML \u003ccode>&lt;head&gt;\u003c/code>, add:\u003c/p>\n\u003cpre>\u003ccode>&lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;\n&lt;script src=&quot;main.js&quot; defer&gt;&lt;/script&gt;\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>href\u003c/code> points to the CSS file. \u003ccode>src\u003c/code> points to the JavaScript file. \u003ccode>defer\u003c/code> runs the external script after the HTML has been parsed, so the buttons and counters already exist.\u003c/p>\n\u003ch2>4. Open the game\u003c/h2>\u003cp>Save all files. In Windows File Explorer, double-click \u003ccode>index.html\u003c/code> to open it in a browser. After editing, press \u003cstrong>Ctrl + S\u003c/strong> in VS Code and refresh the browser with \u003cstrong>Ctrl + R\u003c/strong>.\u003c/p>\n\u003cdetails>\u003csummary>Files do not load?\u003c/summary>\u003cp>Keep all three files in the same folder. Check spelling and extensions: \u003ccode>main.js\u003c/code> must not be \u003ccode>main.js.txt\u003c/code>. In File Explorer, enable \u003cstrong>View → Show → File name extensions\u003c/strong>.\u003c/p>\u003cp>If there is no style, check \u003ccode>href=\"style.css\"\u003c/code>. If clicking does nothing, check \u003ccode>src=\"main.js\"\u003c/code> and look for errors in the browser console (F12). Save before refreshing.\u003c/p>\u003c/details>\n\u003cbutton class=\"file-link\" data-file=\"index.html\">View complete index.html ↗\u003c/button>"}, {"title": "Create the HTML", "label": "STRUCTURE", "subtitle": "Give every important element a name.", "body": "\n\u003cp class=\"lead\">HTML is a tree of elements. A \u003ccode>&lt;button&gt;\u003c/code> is clickable. A \u003ccode>&lt;span&gt;\u003c/code> holds short text. An \u003ccode>id\u003c/code> names one element so JavaScript can find it.\u003c/p>\n\u003ch2>A complete tiny example\u003c/h2>\u003cpre>\u003ccode>&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n  &lt;meta charset=&quot;UTF-8&quot;&gt;\n  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;\n  &lt;title&gt;My clicker&lt;/title&gt;\n  &lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;\n  &lt;script src=&quot;main.js&quot; defer&gt;&lt;/script&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;My clicker&lt;/h1&gt;\n  &lt;div id=&quot;coins&quot;&gt;0&lt;/div&gt;\n  &lt;button id=&quot;earn&quot; type=&quot;button&quot;&gt;Earn coins&lt;/button&gt;\n&lt;/body&gt;\n&lt;/html&gt;\u003c/code>\u003c/pre>\n\u003cp>This is a structure example, not the full reference game. The supplied \u003ccode>main.js\u003c/code> also needs the upgrade, statistics, reset, and language elements in the complete \u003ccode>index.html\u003c/code>.\u003c/p>\n\u003ch2>How JavaScript finds a counter\u003c/h2>\u003cpre>\u003ccode>document.getElementById(&quot;coins&quot;)\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>document\u003c/code> means the current page. \u003ccode>getElementById\u003c/code> finds an element with that ID. Keep IDs identical in HTML and JavaScript.\u003c/p>\n\u003ch2>Class versus ID\u003c/h2>\u003cp>An \u003ccode>id\u003c/code> is unique. A \u003ccode>class\u003c/code> may be shared by several elements, such as both upgrade buttons. CSS uses \u003ccode>.upgrade\u003c/code> to style their shared class.\u003c/p>\n\u003cdiv class=\"try\">\u003cspan>YOUR TURN\u003c/span>\u003cp>Edit the visible game title. The reference uses \u003ccode>data-game-key=\"heading\"\u003c/code>, so its language helper replaces the text. Change \u003ccode>heading\u003c/code> in both language entries in \u003ccode>main.js\u003c/code> to keep your custom title in both languages.\u003c/p>\u003c/div>\n\u003cbutton class=\"file-link\" data-file=\"index.html\">View complete index.html ↗\u003c/button>"}, {"title": "Style with CSS", "label": "APPEARANCE", "subtitle": "Make the coin feel clickable and the shop easy to read.", "body": "\n\u003cp class=\"lead\">A CSS rule has a \u003cstrong>selector\u003c/strong> and \u003cstrong>properties\u003c/strong>. The selector chooses elements; properties change their appearance.\u003c/p>\n\u003cpre>\u003ccode>.coin {\n  width: 126px;\n  height: 126px;\n  border-radius: 50%;\n  background: #ffcb71;\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>.coin\u003c/code> selects \u003ccode>class=\"coin\"\u003c/code>. Equal width and height with \u003ccode>border-radius: 50%\u003c/code> create a circle. \u003ccode>px\u003c/code> means CSS pixels.\u003c/p>\n\u003ch2>Arrange the statistics\u003c/h2>\u003cpre>\u003ccode>.stats {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>grid\u003c/code> arranges child elements. The two \u003ccode>1fr\u003c/code> values create equally sized columns.\u003c/p>\n\u003ch2>Show button states\u003c/h2>\u003cpre>\u003ccode>.upgrade:disabled {\n  cursor: not-allowed;\n  opacity: .5;\n}\n.coin:active {\n  transform: translateY(6px);\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>:disabled\u003c/code> selects a disabled button. \u003ccode>:active\u003c/code> applies while pressing it. JavaScript controls affordability; CSS draws the feedback.\u003c/p>\n\u003cdiv class=\"try\">\u003cspan>YOUR TURN\u003c/span>\u003cp>In \u003ccode>style.css\u003c/code>, change the coin background to \u003ccode>#87e5ca\u003c/code>. Change its border color too. Save and refresh your browser. Keep the keyboard focus outline.\u003c/p>\u003c/div>\n\u003cbutton class=\"file-link\" data-file=\"style.css\">View complete style.css ↗\u003c/button>"}, {"title": "JavaScript & TypeScript", "label": "BEHAVIOR", "subtitle": "Learn the runnable code, then compare optional types.", "body": "\n\u003ch2>1. Store the game data\u003c/h2>\u003cpre>\u003ccode>const state = { coins: 0, clickLevel: 0, autoLevel: 0 };\u003c/code>\u003c/pre>\n\u003cp>An \u003cstrong>object\u003c/strong> groups values. Its properties hold the coin balance and upgrade levels. \u003ccode>const\u003c/code> prevents replacing the object; its properties can still change.\u003c/p>\n\u003ch2>2. Write reusable functions\u003c/h2>\u003cpre>\u003ccode>function clickPower() {\n  return 1 + state.clickLevel;\n}\nfunction earnCoins() {\n  state.coins += clickPower();\n  render();\n}\u003c/code>\u003c/pre>\n\u003cp>A \u003cstrong>function\u003c/strong> performs reusable work. \u003ccode>return\u003c/code> gives a result back. \u003ccode>+=\u003c/code> adds to the current value. At click levels 0, 1, and 2, power is 1, 2, and 3.\u003c/p>\n\u003ch2>3. Connect events and redraw\u003c/h2>\u003cpre>\u003ccode>earnButton.addEventListener(&quot;click&quot;, earnCoins);\ncoinsText.textContent = String(state.coins);\u003c/code>\u003c/pre>\n\u003cp>Pass \u003ccode>earnCoins\u003c/code> without parentheses: the browser calls it on a click. \u003ccode>textContent\u003c/code> changes visible text. The reference \u003ccode>render()\u003c/code> updates counters, button states, and translated status text.\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>Remember\u003c/strong>\u003cp>Changing state does not automatically change HTML. Update state first, then call render().\u003c/p>\u003c/div>\n\u003ch2>Optional: what TypeScript adds\u003c/h2>\u003cpre>\u003ccode>interface GameState {\n  coins: number;\n  clickLevel: number;\n  autoLevel: number;\n}\nconst state: GameState = { coins: 0, clickLevel: 0, autoLevel: 0 };\nfunction clickPower(): number {\n  return 1 + state.clickLevel;\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>interface\u003c/code> describes an object’s shape. \u003ccode>: number\u003c/code> describes a numeric value. TypeScript catches mistakes such as assigning \u003ccode>\"ten\"\u003c/code> to a numeric coin balance.\u003c/p>\n\u003cp>Open the \u003ca href=\"https://www.typescriptlang.org/play/\" target=\"_blank\" rel=\"noopener\">TypeScript Playground\u003c/a>, paste the optional \u003ccode>main.ts\u003c/code> example, and inspect its JavaScript output. You need internet for the Playground. This game already includes runnable \u003ccode>main.js\u003c/code>; the browser does not load \u003ccode>main.ts\u003c/code>.\u003c/p>\n\u003cdetails>\u003csummary>How the language switch works\u003c/summary>\u003cp>\u003ccode>gameText.en\u003c/code> and \u003ccode>gameText.id\u003c/code> contain labels. \u003ccode>data-game-key\u003c/code> connects an element to a label. \u003ccode>setGameLanguage()\u003c/code> changes text and the page’s \u003ccode>lang\u003c/code> attribute, then redraws. The game’s coin state stays intact. Identifiers such as \u003ccode>state.coins\u003c/code> are not translated.\u003c/p>\u003c/details>\n\u003cbutton class=\"file-link\" data-file=\"main.js\">View complete main.js ↗\u003c/button>\u003cbutton class=\"file-link\" data-file=\"main.ts\">View complete main.ts ↗\u003c/button>"}, {"title": "Upgrades & auto income", "label": "THE GAME LOOP", "subtitle": "Spend safely and let one timer run the economy.", "body": "\n\u003ch2>Upgrade prices grow with the level\u003c/h2>\u003cpre>\u003ccode>return Math.ceil(10 * 1.6 ** state.clickLevel);\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>**\u003c/code> means exponent. \u003ccode>Math.ceil\u003c/code> rounds upward. Click upgrade prices start at \u003cstrong>10, 16, 26, 41\u003c/strong>. Auto-clickers use base 25 and growth 1.8.\u003c/p>\n\u003cdiv class=\"lab\">\u003cspan class=\"mini-tag\">ECONOMY SANDBOX\u003c/span>\u003ch3>Try a different price curve\u003c/h3>\u003cp>These controls calculate prices. They do not edit your source or change the game.\u003c/p>\u003cdiv class=\"lab-controls\">\u003clabel>Base cost\u003cinput id=\"lab-base\" type=\"number\" min=\"1\" max=\"1000\" value=\"10\">\u003c/label>\u003clabel>Growth factor\u003cinput id=\"lab-growth\" type=\"number\" min=\"1\" max=\"3\" step=\"0.1\" value=\"1.6\">\u003c/label>\u003c/div>\u003cdiv id=\"lab-prices\" class=\"price-cells\" aria-live=\"polite\">\u003c/div>\u003c/div>\n\u003ch2>Buy in the right order\u003c/h2>\u003cpre>\u003ccode>const cost = clickCost();\nif (state.coins &lt; cost) return;\nstate.coins -= cost;\nstate.clickLevel += 1;\nrender();\u003c/code>\u003c/pre>\n\u003col>\u003cli>Calculate the price before raising the level.\u003c/li>\u003cli>Stop if the balance is too low.\u003c/li>\u003cli>Subtract the price, raise the level, and redraw.\u003c/li>\u003c/ol>\u003cp>\u003ccode>&lt;\u003c/code> means “less than”; \u003ccode>-=\u003c/code> subtracts from a value. Check affordability in code even when the button is disabled.\u003c/p>\n\u003ch2>One automatic timer\u003c/h2>\u003cpre>\u003ccode>window.setInterval(() =&gt; {\n  if (state.autoLevel &gt; 0) {\n    state.coins += state.autoLevel;\n    render();\n  }\n}, 1000);\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>setInterval\u003c/code> repeats a function. \u003ccode>1000\u003c/code> milliseconds is one second. \u003ccode>() =&gt; { ... }\u003c/code> is an arrow function. Buying an auto-clicker raises \u003ccode>autoLevel\u003c/code>; it does not add another timer.\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>Remember\u003c/strong>\u003cp>Timers are approximate and may slow down in background tabs. This game has no saved progress or offline income. Refreshing starts a new session.\u003c/p>\u003c/div>\n\u003cdiv class=\"try\">\u003cspan>YOUR TURN\u003c/span>\u003cp>Buy one auto-clicker: income rises by 1 each tick. A second raises it to 2. Change the growth factor in the calculator and compare how quickly prices rise.\u003c/p>\u003c/div>\n\u003cbutton class=\"file-link\" data-file=\"main.js\">View complete main.js ↗\u003c/button>"}, {"title": "Share one HTML file", "label": "MAKE IT PORTABLE", "subtitle": "Keep separate files while learning; combine them to share.", "body": "\n\u003ch2>Option A: share the folder\u003c/h2>\u003cp>Keep \u003ccode>index.html\u003c/code>, \u003ccode>style.css\u003c/code>, and \u003ccode>main.js\u003c/code> together. Send all three in a ZIP. The recipient extracts it and opens \u003ccode>index.html\u003c/code>.\u003c/p>\n\u003ch2>Option B: put everything in one HTML\u003c/h2>\u003col>\u003cli>Create a copy named \u003ccode>game-single.html\u003c/code>.\u003c/li>\u003cli>Replace the stylesheet link with a \u003ccode>&lt;style&gt;\u003c/code> block and paste all of \u003ccode>style.css\u003c/code> inside it.\u003c/li>\u003cli>Remove the external script tag from the head. Just before \u003ccode>&lt;/body&gt;\u003c/code>, add a \u003ccode>&lt;script&gt;\u003c/code> block containing all of \u003ccode>main.js\u003c/code>.\u003c/li>\u003cli>Save and open the new HTML file. Test it in a folder containing no CSS or JavaScript files.\u003c/li>\u003c/ol>\n\u003cpre>\u003ccode>&lt;head&gt;\n  &lt;style&gt;\n    /* Paste all style.css here / Tempel seluruh style.css di sini */\n  &lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;!-- Keep the game HTML here / Pertahankan HTML game di sini --&gt;\n  &lt;script&gt;\n    // Paste all main.js here / Tempel seluruh main.js di sini\n  &lt;/script&gt;\n&lt;/body&gt;\u003c/code>\u003c/pre>\n\u003cp>This snippet shows where the code goes; it is not a complete game. Paste the full contents, not file names or placeholder comments. The script goes last so all elements exist before it runs. The single file is still an HTML page using JavaScript.\u003c/p>\n\u003cdiv class=\"note success\">\u003cstrong>Your finished output\u003c/strong>\u003cp>\u003ccode>game-single.html\u003c/code> · CSS and JavaScript included · playable offline · no installation\u003c/p>\u003c/div>\n\u003cbutton class=\"primary\" data-download=\"game\">Download single-file reference ↓\u003c/button>\n\u003cp>The download is the ready-made reference in your selected language, with its own EN/ID controls. Your VS Code edits do not change this tutorial’s preview or downloads; combine your own files to share your edits.\u003c/p>\n"}, {"title": "Test & make it yours", "label": "YOUR NEXT STEP", "subtitle": "Verify the rules before adding more features.", "body": "\n\u003cp class=\"lead\">Test your own HTML game. Choose \u003cstrong>Reset game\u003c/strong> before each independent test. Check the expected results below.\u003c/p>\n\u003cdiv class=\"check-list\">\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Starting state\u003c/strong>0 coins, 1 per click, 0 per second, both upgrades disabled.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Affordability boundary\u003c/strong>At 9 coins, the click upgrade is disabled. At 10, it is available.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Exact spending\u003c/strong>Buy at 10 coins: balance becomes 0, power becomes 2, next price becomes 16.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Automatic income\u003c/strong>From reset, click 25 times and buy one auto-clicker. Earn 1 each timer tick. Next auto price is 45.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Reset stops income\u003c/strong>Reset after buying auto income. Balance and levels reset; no further automatic coins are granted.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Language & accessibility\u003c/strong>Switch EN/ID. Labels change but coins and upgrades remain. Tab and Enter or Space operate buttons. Test a narrow screen.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Single-file output\u003c/strong>Move game-single.html alone to another folder and open it offline. The game works. Refresh resets the session.\u003c/span>\u003c/label>\n\u003c/div>\u003cp id=\"qa-count\" class=\"muted\" aria-live=\"polite\">\u003c/p>\n\u003ch2>Three small experiments\u003c/h2>\u003col>\u003cli>\u003cstrong>Change the theme:\u003c/strong> edit coin labels in both \u003ccode>gameText\u003c/code> language entries. Keep IDs and code identifiers the same.\u003c/li>\u003cli>\u003cstrong>Change the balance:\u003c/strong> replace growth 1.6 with 1.4 in \u003ccode>clickCost()\u003c/code>. Save and refresh.\u003c/li>\u003cli>\u003cstrong>Double the upgrade bonus:\u003c/strong> change \u003ccode>1 + state.clickLevel\u003c/code> to \u003ccode>1 + state.clickLevel * 2\u003c/code>. Update both translated shop descriptions to +2 per click.\u003c/li>\u003c/ol>\n\u003cdetails>\u003csummary>Next project: saving progress\u003c/summary>\u003cp>Later, add \u003ccode>localStorage\u003c/code> with JSON, input validation, and error handling for unavailable storage. Offline income needs a saved timestamp and elapsed-time calculation; a timer alone does not provide it.\u003c/p>\u003c/details>\n\u003ch2>Official references\u003c/h2>\u003cul class=\"references\">\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/link\" target=\"_blank\" rel=\"noopener\">HTML stylesheet links\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script\" target=\"_blank\" rel=\"noopener\">HTML script and defer\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.typescriptlang.org/play/\" target=\"_blank\" rel=\"noopener\">TypeScript Playground\u003c/a>\u003c/li>\u003c/ul>\n"}], "id": [{"title": "Kenali game kamu", "label": "DASAR", "subtitle": "Satu tombol. Satu mata uang. Dua cara berkembang.", "body": "\n\u003cp class=\"lead\">Buat \u003cstrong>Coin Lab\u003c/strong> dengan HTML, CSS, dan JavaScript biasa. Mainkan contoh game sambil belajar. TypeScript dibahas sebagai perbandingan opsional, tanpa perlu instalasi lokal.\u003c/p>\n\u003cdiv class=\"concept-grid\">\u003carticle>\u003cspan class=\"mini-tag\">HTML\u003c/span>\u003ch3>Struktur\u003c/h3>\u003cp>Membuat penghitung koin, tombol, dan toko.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"mini-tag\">CSS\u003c/span>\u003ch3>Tampilan\u003c/h3>\u003cp>Mengatur warna, jarak, dan tata letak.\u003c/p>\u003c/article>\u003carticle>\u003cspan class=\"mini-tag\">JS / TS\u003c/span>\u003ch3>Perilaku\u003c/h3>\u003cp>Mengatur koin, klik, dan upgrade.\u003c/p>\u003c/article>\u003c/div>\n\u003ch2>Aturan yang akan kamu buat\u003c/h2>\u003col>\u003cli>Mulai dengan \u003cstrong>0 koin\u003c/strong>. Setiap klik menghasilkan \u003cstrong>1 koin\u003c/strong>.\u003c/li>\u003cli>Upgrade klik pertama berharga \u003cstrong>10 koin\u003c/strong> dan menambah \u003cstrong>+1 koin per klik\u003c/strong>.\u003c/li>\u003cli>Klik otomatis pertama berharga \u003cstrong>25 koin\u003c/strong> dan menambah \u003cstrong>+1 koin per detik\u003c/strong>.\u003c/li>\u003cli>Harga naik setiap kali membeli upgrade. Kamu hanya bisa membeli jika koin cukup.\u003c/li>\u003c/ol>\n\u003cdiv class=\"try\">\u003cspan>COBA SEKARANG\u003c/span>\u003cp>Klik 10 kali. Beli \u003cstrong>Klik lebih kuat\u003c/strong>. Klik berikutnya menghasilkan 2 koin. Ganti bahasa di atas: jumlah koin tetap sama.\u003c/p>\u003c/div>\n\u003ch2>Alur kerja sederhana\u003c/h2>\u003cp>Edit \u003ccode>index.html\u003c/code>, \u003ccode>style.css\u003c/code>, dan \u003ccode>main.js\u003c/code> dalam satu folder. HTML memuat CSS dan skrip secara langsung. Simpan, buka \u003ccode>index.html\u003c/code>, lalu muat ulang setelah mengedit.\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>Ingat\u003c/strong>\u003cp>Tidak perlu terminal, instalasi paket, atau perintah build. Browser menjalankan JavaScript; anotasi tipe TypeScript tidak bisa dijalankan langsung. Pelajaran TypeScript opsional menjelaskan perbedaannya.\u003c/p>\u003c/div>\n\u003cp>Ingin membagikan satu file saja? Pelajaran 7 menunjukkan cara memasukkan CSS dan JavaScript ke dalam satu HTML.\u003c/p>\u003cp class=\"muted\">Sekitar 45–75 menit · ramah pemula · bisa offline · 8 pelajaran\u003c/p>\n"}, {"title": "Siapkan HTML dasar", "label": "RUANG KERJA", "subtitle": "Tiga file. Satu folder. Buka di browser.", "body": "\n\u003ch2>1. Buat folder\u003c/h2>\u003cp>Buat folder bernama \u003ccode>coin-lab\u003c/code> di Windows. Buka folder itu melalui \u003cstrong>File → Open Folder\u003c/strong> di VS Code. Tidak perlu terminal.\u003c/p>\n\u003ch2>2. Buat tiga file\u003c/h2>\u003cdiv class=\"file-list\">\u003cdiv>\u003ccode>index.html\u003c/code>\u003cspan>Struktur halaman dan tautan file\u003c/span>\u003c/div>\u003cdiv>\u003ccode>style.css\u003c/code>\u003cspan>Warna dan tata letak\u003c/span>\u003c/div>\u003cdiv>\u003ccode>main.js\u003c/code>\u003cspan>Logika game\u003c/span>\u003c/div>\u003c/div>\n\u003cp>Salin file lengkap dari bagian \u003cstrong>Di balik layar\u003c/strong> di bawah, atau unduh ZIP contoh yang sudah berfungsi, pilih \u003cstrong>Extract All\u003c/strong>, lalu buka folder hasil ekstraksi.\u003c/p>\u003cbutton class=\"primary\" data-download=\"zip\">Unduh ZIP kode sumber ↓\u003c/button>\n\u003ch2>3. Hubungkan CSS dan skrip\u003c/h2>\u003cp>Di dalam \u003ccode>&lt;head&gt;\u003c/code> HTML, tambahkan:\u003c/p>\n\u003cpre>\u003ccode>&lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;\n&lt;script src=&quot;main.js&quot; defer&gt;&lt;/script&gt;\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>href\u003c/code> menunjuk file CSS. \u003ccode>src\u003c/code> menunjuk file JavaScript. \u003ccode>defer\u003c/code> membuat skrip eksternal berjalan setelah HTML selesai diparsing, sehingga tombol dan penghitung sudah tersedia.\u003c/p>\n\u003ch2>4. Buka game\u003c/h2>\u003cp>Simpan semua file. Di File Explorer Windows, klik dua kali \u003ccode>index.html\u003c/code> untuk membukanya di browser. Setelah mengedit, tekan \u003cstrong>Ctrl + S\u003c/strong> di VS Code dan \u003cstrong>Ctrl + R\u003c/strong> di browser untuk memuat ulang.\u003c/p>\n\u003cdetails>\u003csummary>File tidak termuat?\u003c/summary>\u003cp>Simpan ketiga file dalam folder yang sama. Periksa ejaan dan ekstensi: \u003ccode>main.js\u003c/code> tidak boleh menjadi \u003ccode>main.js.txt\u003c/code>. Di File Explorer, aktifkan \u003cstrong>View → Show → File name extensions\u003c/strong>.\u003c/p>\u003cp>Jika tampilan polos, periksa \u003ccode>href=\"style.css\"\u003c/code>. Jika tombol tidak berfungsi, periksa \u003ccode>src=\"main.js\"\u003c/code> dan lihat pesan error di konsol browser (F12). Simpan sebelum memuat ulang.\u003c/p>\u003c/details>\n\u003cbutton class=\"file-link\" data-file=\"index.html\">Lihat file lengkap index.html ↗\u003c/button>"}, {"title": "Buat HTML", "label": "STRUKTUR", "subtitle": "Beri nama setiap elemen penting.", "body": "\n\u003cp class=\"lead\">HTML membentuk pohon elemen. \u003ccode>&lt;button&gt;\u003c/code> adalah tombol yang bisa diklik. \u003ccode>&lt;span&gt;\u003c/code> menampung teks singkat. \u003ccode>id\u003c/code> memberi nama unik agar JavaScript dapat menemukan elemen.\u003c/p>\n\u003ch2>Contoh halaman kecil yang lengkap\u003c/h2>\u003cpre>\u003ccode>&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;id&quot;&gt;\n&lt;head&gt;\n  &lt;meta charset=&quot;UTF-8&quot;&gt;\n  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;\n  &lt;title&gt;Game klik saya&lt;/title&gt;\n  &lt;link rel=&quot;stylesheet&quot; href=&quot;style.css&quot;&gt;\n  &lt;script src=&quot;main.js&quot; defer&gt;&lt;/script&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;h1&gt;Game klik saya&lt;/h1&gt;\n  &lt;div id=&quot;coins&quot;&gt;0&lt;/div&gt;\n  &lt;button id=&quot;earn&quot; type=&quot;button&quot;&gt;Dapatkan koin&lt;/button&gt;\n&lt;/body&gt;\n&lt;/html&gt;\u003c/code>\u003c/pre>\n\u003cp>Ini contoh struktur, bukan game referensi lengkap. File \u003ccode>main.js\u003c/code> yang disediakan juga membutuhkan elemen upgrade, statistik, reset, dan bahasa dari \u003ccode>index.html\u003c/code> lengkap.\u003c/p>\n\u003ch2>Cara JavaScript menemukan penghitung\u003c/h2>\u003cpre>\u003ccode>document.getElementById(&quot;coins&quot;)\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>document\u003c/code> adalah halaman saat ini. \u003ccode>getElementById\u003c/code> menemukan elemen dengan ID tersebut. ID di HTML dan JavaScript harus sama.\u003c/p>\n\u003ch2>Perbedaan class dan ID\u003c/h2>\u003cp>\u003ccode>id\u003c/code> bersifat unik. \u003ccode>class\u003c/code> boleh dipakai beberapa elemen, misalnya kedua tombol upgrade. CSS memakai \u003ccode>.upgrade\u003c/code> untuk mengatur tampilan class yang sama.\u003c/p>\n\u003cdiv class=\"try\">\u003cspan>GILIRAN KAMU\u003c/span>\u003cp>Ubah judul game. Contoh memakai \u003ccode>data-game-key=\"heading\"\u003c/code>, sehingga fungsi bahasa mengganti teksnya. Ubah \u003ccode>heading\u003c/code> pada kedua pilihan bahasa di \u003ccode>main.js\u003c/code> agar judul baru muncul dalam kedua bahasa.\u003c/p>\u003c/div>\n\u003cbutton class=\"file-link\" data-file=\"index.html\">Lihat file lengkap index.html ↗\u003c/button>"}, {"title": "Atur tampilan dengan CSS", "label": "TAMPILAN", "subtitle": "Buat koin terasa bisa diklik dan toko mudah dibaca.", "body": "\n\u003cp class=\"lead\">Aturan CSS terdiri dari \u003cstrong>selector\u003c/strong> dan \u003cstrong>properti\u003c/strong>. Selector memilih elemen; properti mengubah tampilannya.\u003c/p>\n\u003cpre>\u003ccode>.coin {\n  width: 126px;\n  height: 126px;\n  border-radius: 50%;\n  background: #ffcb71;\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>.coin\u003c/code> memilih \u003ccode>class=\"coin\"\u003c/code>. Lebar dan tinggi yang sama, ditambah \u003ccode>border-radius: 50%\u003c/code>, membentuk lingkaran. \u003ccode>px\u003c/code> berarti piksel CSS.\u003c/p>\n\u003ch2>Susun statistik\u003c/h2>\u003cpre>\u003ccode>.stats {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>grid\u003c/code> mengatur elemen anak. Dua nilai \u003ccode>1fr\u003c/code> membagi ruang menjadi dua kolom yang sama besar.\u003c/p>\n\u003ch2>Tunjukkan status tombol\u003c/h2>\u003cpre>\u003ccode>.upgrade:disabled {\n  cursor: not-allowed;\n  opacity: .5;\n}\n.coin:active {\n  transform: translateY(6px);\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>:disabled\u003c/code> memilih tombol yang dinonaktifkan. \u003ccode>:active\u003c/code> berlaku saat tombol ditekan. JavaScript menentukan apakah koin cukup; CSS menampilkan respons visualnya.\u003c/p>\n\u003cdiv class=\"try\">\u003cspan>GILIRAN KAMU\u003c/span>\u003cp>Di \u003ccode>style.css\u003c/code>, ubah latar koin menjadi \u003ccode>#87e5ca\u003c/code>. Ubah juga warna garis tepinya. Simpan lalu muat ulang browser. Pertahankan garis fokus untuk pengguna keyboard.\u003c/p>\u003c/div>\n\u003cbutton class=\"file-link\" data-file=\"style.css\">Lihat file lengkap style.css ↗\u003c/button>"}, {"title": "JavaScript & TypeScript", "label": "PERILAKU", "subtitle": "Pelajari kode yang berjalan, lalu bandingkan tipe opsional.", "body": "\n\u003ch2>1. Simpan data game\u003c/h2>\u003cpre>\u003ccode>const state = { coins: 0, clickLevel: 0, autoLevel: 0 };\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Object\u003c/strong> mengelompokkan nilai. Properti menyimpan saldo koin dan level upgrade. \u003ccode>const\u003c/code> mencegah penggantian object, tetapi propertinya masih dapat diubah.\u003c/p>\n\u003ch2>2. Buat fungsi yang bisa dipakai ulang\u003c/h2>\u003cpre>\u003ccode>function clickPower() {\n  return 1 + state.clickLevel;\n}\nfunction earnCoins() {\n  state.coins += clickPower();\n  render();\n}\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Fungsi\u003c/strong> menjalankan pekerjaan yang bisa diulang. \u003ccode>return\u003c/code> mengembalikan hasil. \u003ccode>+=\u003c/code> menambahkan nilai ke nilai saat ini. Pada level klik 0, 1, dan 2, kekuatannya adalah 1, 2, dan 3.\u003c/p>\n\u003ch2>3. Hubungkan event dan perbarui layar\u003c/h2>\u003cpre>\u003ccode>earnButton.addEventListener(&quot;click&quot;, earnCoins);\ncoinsText.textContent = String(state.coins);\u003c/code>\u003c/pre>\n\u003cp>Tulis \u003ccode>earnCoins\u003c/code> tanpa tanda kurung: browser memanggilnya saat tombol diklik. \u003ccode>textContent\u003c/code> mengubah teks yang terlihat. Fungsi \u003ccode>render()\u003c/code> pada contoh memperbarui penghitung, status tombol, dan pesan sesuai bahasa.\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>Ingat\u003c/strong>\u003cp>Mengubah state tidak otomatis mengubah HTML. Ubah state terlebih dahulu, lalu panggil render().\u003c/p>\u003c/div>\n\u003ch2>Opsional: tambahan dari TypeScript\u003c/h2>\u003cpre>\u003ccode>interface GameState {\n  coins: number;\n  clickLevel: number;\n  autoLevel: number;\n}\nconst state: GameState = { coins: 0, clickLevel: 0, autoLevel: 0 };\nfunction clickPower(): number {\n  return 1 + state.clickLevel;\n}\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>interface\u003c/code> menjelaskan bentuk object. \u003ccode>: number\u003c/code> menyatakan nilai angka. TypeScript mendeteksi kesalahan seperti memasukkan \u003ccode>\"ten\"\u003c/code> ke saldo koin yang seharusnya angka.\u003c/p>\n\u003cp>Buka \u003ca href=\"https://www.typescriptlang.org/play/\" target=\"_blank\" rel=\"noopener\">TypeScript Playground\u003c/a>, tempel contoh opsional \u003ccode>main.ts\u003c/code>, lalu lihat hasil JavaScript-nya. Playground memerlukan internet. Game ini sudah menyediakan \u003ccode>main.js\u003c/code> yang bisa langsung dijalankan; browser tidak memuat \u003ccode>main.ts\u003c/code>.\u003c/p>\n\u003cdetails>\u003csummary>Cara kerja penggantian bahasa\u003c/summary>\u003cp>\u003ccode>gameText.en\u003c/code> dan \u003ccode>gameText.id\u003c/code> berisi label. \u003ccode>data-game-key\u003c/code> menghubungkan elemen dengan label. \u003ccode>setGameLanguage()\u003c/code> mengganti teks dan atribut \u003ccode>lang\u003c/code> halaman, lalu memperbarui layar. Data koin tetap utuh. Nama dalam kode seperti \u003ccode>state.coins\u003c/code> tidak diterjemahkan.\u003c/p>\u003c/details>\n\u003cbutton class=\"file-link\" data-file=\"main.js\">Lihat file lengkap main.js ↗\u003c/button>\u003cbutton class=\"file-link\" data-file=\"main.ts\">Lihat file lengkap main.ts ↗\u003c/button>"}, {"title": "Upgrade & koin otomatis", "label": "PERULANGAN GAME", "subtitle": "Belanjakan koin dengan aman dan gunakan satu timer.", "body": "\n\u003ch2>Harga upgrade naik sesuai level\u003c/h2>\u003cpre>\u003ccode>return Math.ceil(10 * 1.6 ** state.clickLevel);\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>**\u003c/code> berarti pangkat. \u003ccode>Math.ceil\u003c/code> membulatkan ke atas. Harga upgrade klik dimulai dari \u003cstrong>10, 16, 26, 41\u003c/strong>. Klik otomatis memakai harga dasar 25 dan faktor pertumbuhan 1.8.\u003c/p>\n\u003cdiv class=\"lab\">\u003cspan class=\"mini-tag\">SIMULASI EKONOMI\u003c/span>\u003ch3>Coba kurva harga lain\u003c/h3>\u003cp>Kontrol ini hanya menghitung harga. Kode sumber dan game tidak berubah.\u003c/p>\u003cdiv class=\"lab-controls\">\u003clabel>Harga dasar\u003cinput id=\"lab-base\" type=\"number\" min=\"1\" max=\"1000\" value=\"10\">\u003c/label>\u003clabel>Faktor pertumbuhan\u003cinput id=\"lab-growth\" type=\"number\" min=\"1\" max=\"3\" step=\"0.1\" value=\"1.6\">\u003c/label>\u003c/div>\u003cdiv id=\"lab-prices\" class=\"price-cells\" aria-live=\"polite\">\u003c/div>\u003c/div>\n\u003ch2>Urutan pembelian yang benar\u003c/h2>\u003cpre>\u003ccode>const cost = clickCost();\nif (state.coins &lt; cost) return;\nstate.coins -= cost;\nstate.clickLevel += 1;\nrender();\u003c/code>\u003c/pre>\n\u003col>\u003cli>Hitung harga sebelum menaikkan level.\u003c/li>\u003cli>Hentikan pembelian jika saldo kurang.\u003c/li>\u003cli>Kurangi saldo, naikkan level, lalu perbarui layar.\u003c/li>\u003c/ol>\u003cp>\u003ccode>&lt;\u003c/code> berarti “kurang dari”; \u003ccode>-=\u003c/code> mengurangi nilai. Tetap periksa saldo dalam kode meskipun tombol sudah dinonaktifkan.\u003c/p>\n\u003ch2>Satu timer otomatis\u003c/h2>\u003cpre>\u003ccode>window.setInterval(() =&gt; {\n  if (state.autoLevel &gt; 0) {\n    state.coins += state.autoLevel;\n    render();\n  }\n}, 1000);\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>setInterval\u003c/code> mengulang fungsi. \u003ccode>1000\u003c/code> milidetik adalah satu detik. \u003ccode>() =&gt; { ... }\u003c/code> adalah arrow function. Membeli klik otomatis menaikkan \u003ccode>autoLevel\u003c/code>, bukan menambah timer baru.\u003c/p>\n\u003cdiv class=\"note\">\u003cstrong>Ingat\u003c/strong>\u003cp>Timer tidak selalu tepat dan bisa melambat pada tab latar belakang. Game ini tidak menyimpan progres atau memberi pendapatan offline. Memuat ulang memulai sesi baru.\u003c/p>\u003c/div>\n\u003cdiv class=\"try\">\u003cspan>GILIRAN KAMU\u003c/span>\u003cp>Beli satu klik otomatis: pendapatan bertambah 1 setiap putaran timer. Pembelian kedua menaikkannya menjadi 2. Ubah faktor pertumbuhan pada kalkulator dan bandingkan kenaikan harga.\u003c/p>\u003c/div>\n\u003cbutton class=\"file-link\" data-file=\"main.js\">Lihat file lengkap main.js ↗\u003c/button>"}, {"title": "Bagikan satu file HTML", "label": "MUDAH DIBAGIKAN", "subtitle": "Gunakan file terpisah saat belajar; gabungkan untuk dibagikan.", "body": "\n\u003ch2>Pilihan A: bagikan folder\u003c/h2>\u003cp>Simpan \u003ccode>index.html\u003c/code>, \u003ccode>style.css\u003c/code>, dan \u003ccode>main.js\u003c/code> bersama. Kirim ketiganya dalam ZIP. Penerima mengekstraknya lalu membuka \u003ccode>index.html\u003c/code>.\u003c/p>\n\u003ch2>Pilihan B: gabungkan dalam satu HTML\u003c/h2>\u003col>\u003cli>Buat salinan bernama \u003ccode>game-single.html\u003c/code>.\u003c/li>\u003cli>Ganti tautan stylesheet dengan blok \u003ccode>&lt;style&gt;\u003c/code>, lalu tempel seluruh isi \u003ccode>style.css\u003c/code> di dalamnya.\u003c/li>\u003cli>Hapus tag skrip eksternal dari head. Tepat sebelum \u003ccode>&lt;/body&gt;\u003c/code>, tambahkan blok \u003ccode>&lt;script&gt;\u003c/code> berisi seluruh \u003ccode>main.js\u003c/code>.\u003c/li>\u003cli>Simpan dan buka HTML baru. Uji di folder yang tidak berisi file CSS atau JavaScript.\u003c/li>\u003c/ol>\n\u003cpre>\u003ccode>&lt;head&gt;\n  &lt;style&gt;\n    /* Tempel seluruh style.css di sini */\n  &lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;!-- Pertahankan HTML game di sini --&gt;\n  &lt;script&gt;\n    // Tempel seluruh main.js di sini\n  &lt;/script&gt;\n&lt;/body&gt;\u003c/code>\u003c/pre>\n\u003cp>Potongan ini menunjukkan posisi kode, bukan game lengkap. Tempel isi file sebenarnya, bukan nama file atau komentar penanda. Skrip diletakkan terakhir agar semua elemen tersedia sebelum dijalankan. File tunggal ini tetap berupa halaman HTML dengan JavaScript.\u003c/p>\n\u003cdiv class=\"note success\">\u003cstrong>Hasil akhir kamu\u003c/strong>\u003cp>\u003ccode>game-single.html\u003c/code> · CSS dan JavaScript sudah di dalamnya · bisa dimainkan offline · tanpa instalasi\u003c/p>\u003c/div>\n\u003cbutton class=\"primary\" data-download=\"game\">Unduh contoh satu file ↓\u003c/button>\n\u003cp>Unduhan berisi contoh siap pakai dalam bahasa yang dipilih, dengan tombol EN/ID sendiri. Edit di VS Code tidak mengubah pratinjau atau unduhan tutorial ini; gabungkan file milikmu untuk membagikan hasil edit.\u003c/p>\n"}, {"title": "Uji & kembangkan", "label": "LANGKAH BERIKUTNYA", "subtitle": "Pastikan aturan berfungsi sebelum menambah fitur.", "body": "\n\u003cp class=\"lead\">Uji game HTML buatanmu. Pilih \u003cstrong>Ulangi game\u003c/strong> sebelum setiap pengujian terpisah. Tandai hasil yang sudah sesuai.\u003c/p>\n\u003cdiv class=\"check-list\">\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Kondisi awal\u003c/strong>0 koin, 1 per klik, 0 per detik, kedua upgrade dinonaktifkan.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Batas saldo\u003c/strong>Pada 9 koin, upgrade klik dinonaktifkan. Pada 10 koin, upgrade dapat dibeli.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Pengurangan saldo tepat\u003c/strong>Beli dengan 10 koin: saldo menjadi 0, kekuatan menjadi 2, harga berikutnya 16.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Pendapatan otomatis\u003c/strong>Dari kondisi awal, klik 25 kali dan beli satu klik otomatis. Dapatkan 1 setiap putaran timer. Harga berikutnya 45.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Reset menghentikan pendapatan\u003c/strong>Ulangi setelah membeli klik otomatis. Saldo dan level kembali ke awal; koin otomatis tidak bertambah lagi.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Bahasa & aksesibilitas\u003c/strong>Ganti EN/ID. Label berubah, koin dan upgrade tetap. Gunakan Tab dan Enter atau Spasi. Uji layar sempit.\u003c/span>\u003c/label>\n\u003clabel>\u003cinput type=\"checkbox\" class=\"qa-check\">\u003cspan>\u003cstrong>Hasil satu file\u003c/strong>Pindahkan game-single.html saja ke folder lain dan buka offline. Game berfungsi. Muat ulang menghapus sesi.\u003c/span>\u003c/label>\n\u003c/div>\u003cp id=\"qa-count\" class=\"muted\" aria-live=\"polite\">\u003c/p>\n\u003ch2>Tiga eksperimen kecil\u003c/h2>\u003col>\u003cli>\u003cstrong>Ubah tema:\u003c/strong> edit label koin pada kedua bahasa di \u003ccode>gameText\u003c/code>. Pertahankan ID dan nama dalam kode.\u003c/li>\u003cli>\u003cstrong>Ubah keseimbangan:\u003c/strong> ganti faktor 1.6 menjadi 1.4 pada \u003ccode>clickCost()\u003c/code>. Simpan lalu muat ulang.\u003c/li>\u003cli>\u003cstrong>Gandakan bonus upgrade:\u003c/strong> ubah \u003ccode>1 + state.clickLevel\u003c/code> menjadi \u003ccode>1 + state.clickLevel * 2\u003c/code>. Sesuaikan kedua deskripsi toko menjadi +2 per klik.\u003c/li>\u003c/ol>\n\u003cdetails>\u003csummary>Proyek berikutnya: simpan progres\u003c/summary>\u003cp>Nanti, tambahkan \u003ccode>localStorage\u003c/code> dengan JSON, validasi data, dan penanganan error saat penyimpanan tidak tersedia. Pendapatan offline membutuhkan waktu tersimpan dan perhitungan selisih waktu; timer saja tidak cukup.\u003c/p>\u003c/details>\n\u003ch2>Referensi resmi\u003c/h2>\u003cul class=\"references\">\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/link\" target=\"_blank\" rel=\"noopener\">Tautan stylesheet HTML\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script\" target=\"_blank\" rel=\"noopener\">Skrip HTML dan defer\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.typescriptlang.org/play/\" target=\"_blank\" rel=\"noopener\">TypeScript Playground\u003c/a>\u003c/li>\u003c/ul>\n"}]}, "ui": {"en": {"title": "Coin Lab — Beginner Coding Tutorial", "brandSub": "LEARN BY BUILDING", "navLabel": "YOUR LEARNING PATH", "progress": "COURSE PROGRESS", "sidebarFoot": "A little code. A game you can call your own.", "topbar": "THE BEGINNER’S GAME DEV WORKSHOP", "zip": "Source ZIP ↓", "game": "Single HTML ↓", "eyebrow": "YOUR FIRST BROWSER GAME", "hero1": "Build your first", "hero2": "clicker game.", "heroSub": "Learn the basics. Make it work. Make it yours.", "tech": "HTML + CSS + JavaScript", "setup": "Plain files / VS Code", "lessonCount": "8 short lessons", "back": "← Back", "continue": "Mark done & continue →", "finish": "Finish tutorial ✓", "finished": "Completed ✓", "preview": "LIVE REFERENCE", "play": "● PLAY & EXPERIMENT", "caption": "Play here while you learn. Reset anytime. Your local edits appear in your own HTML game.", "sourceTitle": "Under the hood", "sourceSub": "Complete files. main.ts is an optional learning example, not a game dependency.", "allSource": "Download all source ↓", "copy": "Copy file", "downloadFile": "Download file ↓", "pageFoot": "One currency. Two upgrades. A complete first project.", "navAria": "Tutorial lessons", "languageAria": "Tutorial language", "lessonAria": "Current lesson", "previewAria": "Playable reference game", "sourceAria": "Complete source code", "tabsAria": "Source files", "frameAria": "Coin Lab playable reference game", "downloadReady": "Download ready. Check your browser’s downloads.", "copied": "File copied.", "copyFallback": "Code selected. Press Ctrl+C to copy.", "allDone": "All eight lessons completed. Time to make it yours!", "lessonDone": "Lesson complete. You can revisit earlier lessons anytime.", "checks": "checks completed", "lines": "lines", "optional": "optional learning example", "labError": "Use base 1–1000 and growth 1–3.", "level": "Level"}, "id": {"title": "Coin Lab — Tutorial Coding untuk Pemula", "brandSub": "BELAJAR DENGAN MEMBUAT", "navLabel": "JALUR BELAJARMU", "progress": "PROGRES BELAJAR", "sidebarFoot": "Sedikit kode. Sebuah game buatanmu sendiri.", "topbar": "LOKAKARYA GAME UNTUK PEMULA", "zip": "ZIP sumber ↓", "game": "Satu HTML ↓", "eyebrow": "GAME BROWSER PERTAMAMU", "hero1": "Buat game klik", "hero2": "pertamamu.", "heroSub": "Pelajari dasarnya. Buat berfungsi. Kembangkan sesuai idemu.", "tech": "HTML + CSS + JavaScript", "setup": "File biasa / VS Code", "lessonCount": "8 pelajaran singkat", "back": "← Kembali", "continue": "Tandai selesai & lanjut →", "finish": "Selesaikan tutorial ✓", "finished": "Selesai ✓", "preview": "CONTOH LANGSUNG", "play": "● MAIN & BEREKSPERIMEN", "caption": "Mainkan sambil belajar. Ulangi kapan saja. Hasil edit lokal muncul di game HTML milikmu.", "sourceTitle": "Di balik layar", "sourceSub": "File lengkap. main.ts adalah contoh belajar opsional, bukan kebutuhan game.", "allSource": "Unduh seluruh sumber ↓", "copy": "Salin file", "downloadFile": "Unduh file ↓", "pageFoot": "Satu mata uang. Dua upgrade. Proyek pertama yang lengkap.", "navAria": "Pelajaran tutorial", "languageAria": "Bahasa tutorial", "lessonAria": "Pelajaran saat ini", "previewAria": "Contoh game yang dapat dimainkan", "sourceAria": "Kode sumber lengkap", "tabsAria": "File kode sumber", "frameAria": "Contoh game Coin Lab yang dapat dimainkan", "downloadReady": "Unduhan siap. Periksa daftar unduhan browser.", "copied": "File berhasil disalin.", "copyFallback": "Kode dipilih. Tekan Ctrl+C untuk menyalin.", "allDone": "Delapan pelajaran selesai. Saatnya mengembangkan idemu!", "lessonDone": "Pelajaran selesai. Kamu dapat membuka kembali pelajaran sebelumnya.", "checks": "pengujian selesai", "lines": "baris", "optional": "contoh belajar opsional", "labError": "Gunakan harga dasar 1–1000 dan faktor 1–3.", "level": "Level"}}, "sources": {"en": {"index.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Coin Lab — Clicker Game\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"style.css\">\n  \u003cscript src=\"main.js\" defer>\u003c/script>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"game\">\n    \u003cheader class=\"game-top\">\u003cspan>COIN LAB\u003c/span>\u003cspan class=\"live\" data-game-key=\"playable\">PLAYABLE\u003c/span>\u003c/header>\n    \u003cdiv id=\"game-language\" class=\"game-language\" role=\"group\" aria-label=\"Game language\">\n      \u003cbutton id=\"game-en\" type=\"button\" aria-pressed=\"true\" lang=\"en\">EN\u003c/button>\n      \u003cbutton id=\"game-id\" type=\"button\" aria-pressed=\"false\" lang=\"id\">ID\u003c/button>\n    \u003c/div>\n    \u003ch1 data-game-key=\"heading\">Small clicks. Big possibilities.\u003c/h1>\n    \u003cp class=\"balance-label\" data-game-key=\"balance\">YOUR COINS\u003c/p>\n    \u003cdiv id=\"coins\" class=\"balance\">0\u003c/div>\n    \u003cbutton id=\"earn\" class=\"coin\" type=\"button\" aria-label=\"Earn 1 coin\">\u003cspan aria-hidden=\"true\">C\u003c/span>\u003c/button>\n    \u003cp class=\"hint\" data-game-key=\"hint\">Click the coin. Build your little empire.\u003c/p>\n    \u003cdiv class=\"stats\">\n      \u003cdiv>\u003cstrong id=\"power\">1\u003c/strong>\u003cspan data-game-key=\"power\">coins / click\u003c/span>\u003c/div>\n      \u003cdiv>\u003cstrong id=\"rate\">0\u003c/strong>\u003cspan data-game-key=\"rate\">coins / second\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003csection id=\"shop\" class=\"shop\" aria-label=\"Upgrade shop\">\n      \u003cbutton id=\"buy-click\" class=\"upgrade\" type=\"button\">\n        \u003cspan class=\"upgrade-icon\" aria-hidden=\"true\">↗\u003c/span>\n        \u003cspan class=\"upgrade-info\">\u003cstrong data-game-key=\"click\">Stronger clicks\u003c/strong>\u003csmall data-game-key=\"clickBonus\">+1 coin per click\u003c/small>\u003c/span>\n        \u003cspan class=\"price\">\u003cspan id=\"click-cost\">10\u003c/span>\u003csmall data-game-key=\"coins\">coins\u003c/small>\u003c/span>\n      \u003c/button>\n      \u003cbutton id=\"buy-auto\" class=\"upgrade\" type=\"button\">\n        \u003cspan class=\"upgrade-icon\" aria-hidden=\"true\">◷\u003c/span>\n        \u003cspan class=\"upgrade-info\">\u003cstrong data-game-key=\"auto\">Auto-clicker\u003c/strong>\u003csmall data-game-key=\"autoBonus\">+1 coin per second\u003c/small>\u003c/span>\n        \u003cspan class=\"price\">\u003cspan id=\"auto-cost\">25\u003c/span>\u003csmall data-game-key=\"coins\">coins\u003c/small>\u003c/span>\n      \u003c/button>\n    \u003c/section>\n    \u003cp id=\"message\" class=\"message\" role=\"status\">Your first upgrade costs 10 coins.\u003c/p>\n    \u003cbutton id=\"reset\" class=\"reset\" type=\"button\" data-game-key=\"reset\">Reset game\u003c/button>\n    \u003cp class=\"footnote\" data-game-key=\"footnote\">Session only · refreshing starts over · no offline income\u003c/p>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n", "style.css": ":root {\n  color-scheme: dark;\n  font-family: \"Segoe UI\", system-ui, sans-serif;\n  color: #f8f5ee;\n  background: #141c2b;\n}\n* {\n  box-sizing: border-box;\n}\nbody {\n  margin: 0;\n}\nbutton {\n  font: inherit;\n  cursor: pointer;\n}\nbutton:focus-visible {\n  outline: 3px solid #87e5ca;\n  outline-offset: 5px;\n}\n.game {\n  width: min(100%, 460px);\n  margin: auto;\n  padding: 28px 24px 20px;\n  text-align: center;\n}\n.game-top {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-size: 11px;\n  font-weight: 800;\n  letter-spacing: 2px;\n  color: #b4bece;\n}\n.live {\n  color: #87e5ca;\n  background: #203c3d;\n  padding: 6px ade:disabled {\n  cursor: not-allowed;\n  opacity: .5;\n}\n.upgrade-icon {\n  display: grid;\n  place-items: center;\n  flex: 0 0 34px;\n  height: 34px;\n  background: #344157;\n  border-radius: 9px;\n  color: #87e5ca;\n  font-size: 24px;\n}\n.upgrade-info {\n  flex: 1;\n}\n.upgrade-info strong {\n  font-size: 12px;\n}\n.upgrade-info small {\n  display: block;\n  margin-top: 4px;\n  font-size: 10px;\n  color: #b4bece;\n}\n.price {\n  text-align: right;\n  font-weight: 700;\n  color: #ffcb71;\n}\n.price small {\n  display: block;\n  font-size: 9px;\n  font-weight: 400;\n  color: #b4bece;\n}\n.message {\n  min-height: 30px;\n  margin: 15px 0 5px;\n  color: #bac5d5;\n  font-size: 11px;\n}\n.reset {\n  background: transparent;\n  color: #b4bece;\n  border: 0;\n  padding: 8px;\n  font-size: 11px;\n  text-decoration: underline;\n}\n.footnote {\n  font-size: 9px;\n  color: #9aa7bb;\n}\n@media (prefers-reduced-motion: reduce) {\n  * {\n    transition: none !important;\n  }\n}\n\n.game-language { display: flex; justify-content: center; gap: 6px; margin: 16px 0 -6px; }\n.game-language button { color: #bec9da; background: #243148; border: 1px solid #485469; border-radius: 5px; font-size: 10px; padding: 4px 10px; }\n.game-language button[aria-pressed=\"true\"] { color: #152033; background: #87e5ca; border-color: #87e5ca; }\nh1 { max-width: 300px; margin-left: auto; margin-right: auto; }\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain class=\"game\">\n    \u003cheader class=\"game-top\">\u003cspan>COIN LAB\u003c/span>\u003cspan class=\"live\" data-game-key=\"playable\">PLAYABLE\u003c/span>\u003c/header>\n    \u003cdiv id=\"game-language\" class=\"game-language\" role=\"group\" aria-label=\"Game language\">\n      \u003cbutton id=\"game-en\" type=\"button\" aria-pressed=\"true\" lang=\"en\">EN\u003c/button>\n      \u003cbutton id=\"game-id\" type=\"button\" aria-pressed=\"false\" lang=\"id\">ID\u003c/button>\n    \u003c/div>\n    \u003ch1 data-game-key=\"heading\">Small clicks. Big possibilities.\u003c/h1>\n    \u003cp class=\"balance-label\" data-game-key=\"balance\">YOUR COINS\u003c/p>\n    \u003cdiv id=\"coins\" class=\"balance\">0\u003c/div>\n    \u003cbutton id=\"earn\" class=\"coin\" type=\"button\" aria-label=\"Earn 1 coin\">\u003cspan aria-hidden=\"true\">C\u003c/span>\u003c/button>\n    \u003cp class=\"hint\" data-game-key=\"hint\">Click the coin. Build your little empire.\u003c/p>\n    \u003cdiv class=\"stats\">\n      \u003cdiv>\u003cstrong id=\"power\">1\u003c/strong>\u003cspan data-game-key=\"power\">coins / click\u003c/span>\u003c/div>\n      \u003cdiv>\u003cstrong id=\"rate\">0\u003c/strong>\u003cspan data-game-key=\"rate\">coins / second\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003csection id=\"shop\" class=\"shop\" aria-label=\"Upgrade shop\">\n      \u003cbutton id=\"buy-click\" class=\"upgrade\" type=\"button\">\n        \u003cspan class=\"upgrade-icon\" aria-hidden=\"true\">↗\u003c/span>\n        \u003cspan class=\"upgrade-info\">\u003cstrong data-game-key=\"click\">Stronger clicks\u003c/strong>\u003csmall data-game-key=\"clickBonus\">+1 coin per click\u003c/small>\u003c/span>\n        \u003cspan class=\"price\">\u003cspan id=\"click-cost\">10\u003c/span>\u003csmall data-game-key=\"coins\">coins\u003c/small>\u003c/span>\n      \u003c/button>\n      \u003cbutton id=\"buy-auto\" class=\"upgrade\" type=\"button\">\n        \u003cspan class=\"upgrade-icon\" aria-hidden=\"true\">◷\u003c/span>\n        \u003cspan class=\"upgrade-info\">\u003cstrong data-game-key=\"auto\">Auto-clicker\u003c/strong>\u003csmall data-game-key=\"autoBonus\">+1 coin per second\u003c/small>\u003c/span>\n        \u003cspan class=\"price\">\u003cspan id=\"auto-cost\">25\u003c/span>\u003csmall data-game-key=\"coins\">coins\u003c/small>\u003c/span>\n      \u003c/button>\n    \u003c/section>\n    \u003cp id=\"message\" class=\"message\" role=\"status\">Your first upgrade costs 10 coins.\u003c/p>\n    \u003cbutton id=\"reset\" class=\"reset\" type=\"button\" data-game-key=\"reset\">Reset game\u003c/button>\n    \u003cp class=\"footnote\" data-game-key=\"footnote\">Session only · refreshing starts over · no offline income\u003c/p>\n  \u003c/main>\n\u003cscript>\n// Store the game data. Change state first, then update the screen.\n// Simpan data game. Ubah state terlebih dahulu, lalu perbarui layar.\nconst state = { coins: 0, clickLevel: 0, autoLevel: 0 };\n\nfunction getElement(id) {\n  const element = document.getElementById(id);\n  if (!element) throw new Error(`Missing HTML element / Elemen tidak ditemukan: ${id}`);\n  return element;\n}\n\nconst coinsText = getElement(\"coins\");\nconst powerText = getElement(\"power\");\nconst rateText = getElement(\"rate\");\nconst clickCostText = getElement(\"click-cost\");\nconst autoCostText = getElement(\"auto-cost\");\nconst messageText = getElement(\"message\");\nconst earnButton = getElement(\"earn\");\nconst clickButton = getElement(\"buy-click\");\nconst autoButton = getElement(\"buy-auto\");\nconst resetButton = getElement(\"reset\");\n\nfunction clickPower() { return 1 + state.clickLevel; }\nfunction clickCost() { return Math.ceil(10 * 1.6 ** state.clickLevel); }\nfunction autoCost() { return Math.ceil(25 * 1.8 ** state.autoLevel); }\n\n// UI translations. Variable names and HTML IDs remain the same.\n// Terjemahan tampilan. Nama variabel dan ID HTML tetap sama.\nconst gameText = {\n  en: {\n    playable: \"PLAYABLE\", heading: \"Small clicks. Big possibilities.\",\n    balance: \"YOUR COINS\", hint: \"Click the coin. Build your little empire.\",\n    power: \"coins / click\", rate: \"coins / second\", click: \"Stronger clicks\",\n    clickBonus: \"+1 coin per click\", auto: \"Auto-clicker\", autoBonus: \"+1 coin per second\",\n    coins: \"coins\", reset: \"Reset game\", footnote: \"Session only · refreshing starts over · no offline income\",\n    initial: \"Your first upgrade costs 10 coins.\", fresh: \"Fresh start. Click the coin to earn!\",\n    clickStatus: \"Click power upgraded to\", autoStatus: \"Auto income upgraded to\",\n    perSecond: \"per second.\", earn: \"Earn\", shop: \"Upgrade shop\", language: \"Game language\"\n  },\n  id: {\n    playable: \"SIAP DIMAINKAN\", heading: \"Klik kecil. Peluang besar.\",\n    balance: \"KOIN KAMU\", hint: \"Klik koinnya. Bangun kerajaan kecilmu.\",\n    power: \"koin / klik\", rate: \"koin / detik\", click: \"Klik lebih kuat\",\n    clickBonus: \"+1 koin per klik\", auto: \"Klik otomatis\", autoBonus: \"+1 koin per detik\",\n    coins: \"koin\", reset: \"Ulangi game\", footnote: \"Hanya sesi ini · muat ulang untuk mulai dari awal · tanpa pendapatan offline\",\n    initial: \"Upgrade pertamamu berharga 10 koin.\", fresh: \"Mulai lagi. Klik koin untuk mendapatkannya!\",\n    clickStatus: \"Kekuatan klik naik menjadi\", autoStatus: \"Pendapatan otomatis naik menjadi\",\n    perSecond: \"per detik.\", earn: \"Dapatkan\", shop: \"Toko upgrade\", language: \"Bahasa game\"\n  }\n};\nlet gameLanguage = document.documentElement.lang === \"id\" ? \"id\" : \"en\";\nlet messageKind = \"initial\";\n\nfunction render() {\n  const text = gameText[gameLanguage];\n  coinsText.textContent = state.coins.toLocaleString(gameLanguage === \"id\" ? \"id-ID\" : \"en-US\");\n  powerText.textContent = String(clickPower());\n  rateText.textContent = String(state.autoLevel);\n  clickCostText.textContent = String(clickCost());\n  autoCostText.textContent = String(autoCost());\n  clickButton.disabled = state.coins \u003c clickCost();\n  autoButton.disabled = state.coins \u003c autoCost();\n  earnButton.setAttribute(\"aria-label\", `${text.earn} ${clickPower()} ${text.coins}`);\n  if (messageKind === \"click\") messageText.textContent = `${text.clickStatus} ${clickPower()}.`;\n  else if (messageKind === \"auto\") messageText.textContent = `${text.autoStatus} ${state.autoLevel} ${text.perSecond}`;\n  else messageText.textContent = text[messageKind];\n}\n\nfunction earnCoins() {\n  state.coins += clickPower();\n  render();\n}\n\nfunction buyClickUpgrade() {\n  const cost = clickCost();\n  if (state.coins \u003c cost) return; // Reject an unaffordable purchase / Tolak jika koin kurang.\n  state.coins -= cost;\n  state.clickLevel += 1;\n  messageKind = \"click\";\n  render();\n}\n\nfunction buyAutoUpgrade() {\n  const cost = autoCost();\n  if (state.coins \u003c cost) return;\n  state.coins -= cost;\n  state.autoLevel += 1;\n  messageKind = \"auto\";\n  render();\n}\n\nfunction resetGame() {\n  state.coins = 0;\n  state.clickLevel = 0;\n  state.autoLevel = 0;\n  messageKind = \"fresh\";\n  render();\n}\n\nearnButton.addEventListener(\"click\", earnCoins);\nclickButton.addEventListener(\"click\", buyClickUpgrade);\nautoButton.addEventListener(\"click\", buyAutoUpgrade);\nresetButton.addEventListener(\"click\", resetGame);\n\n// Only ONE timer, regardless of upgrade count.\n// Hanya SATU timer, berapa pun jumlah upgrade yang dibeli.\nwindow.setInterval(() => {\n  if (state.autoLevel > 0) {\n    state.coins += state.autoLevel;\n    render();\n  }\n}, 1000);\n\nfunction setGameLanguage(language) {\n  if (language !== \"en\" && language !== \"id\") return;\n  gameLanguage = language;\n  document.documentElement.lang = language;\n  const text = gameText[language];\n  document.querySelectorAll(\"[data-game-key]\").forEach(element => {\n    element.textContent = text[element.dataset.gameKey];\n  });\n  getElement(\"shop\").setAttribute(\"aria-label\", text.shop);\n  getElement(\"game-language\").setAttribute(\"aria-label\", text.language);\n  getElement(\"game-en\").setAttribute(\"aria-pressed\", String(language === \"en\"));\n  getElement(\"game-id\").setAttribute(\"aria-pressed\", String(language === \"id\"));\n  document.title = language === \"id\" ? \"Coin Lab — Game Klik\" : \"Coin Lab — Clicker Game\";\n  render();\n}\ngetElement(\"game-en\").addEventListener(\"click\", () => setGameLanguage(\"en\"));\ngetElement(\"game-id\").addEventListener(\"click\", () => set <script>
"use strict";
const data=JSON.parse(document.getElementById("data").textContent);
let language="en", current=0, selectedFile="index.html", toastTimer;
const completed=new Set(), qaDone=new Set();
const labState={base:"10",growth:"1.6"};
const t=key=>data.ui[language][key];
function notify(text){const el=document.getElementById("toast");el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3000)}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function download(kind){if(kind==="game")downloadBlob(new Blob([data.games[language]],{type:"text/html;charset=utf-8"}),"coin-lab-game-"+language+".html");else{const bytes=Uint8Array.from(atob(data.archives[language]),c=>c.charCodeAt(0));downloadBlob(new Blob([bytes],{type:"application/zip"}),"coin-lab-source-"+language+".zip")}notify(t("downloadReady"))}
function sendLanguage(){const frame=document.getElementById("game-frame");frame.contentWindow?.postMessage({type:"coin-lab-language",language},"*")}
function setLanguage(lang){if(!["en","id"].includes(lang))return;language=lang;document.documentElement.lang=lang;document.title=t("title");document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll("[data-i18n-aria]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.i18nAria)));document.getElementById("game-frame").title=t("frameAria");document.getElementById("language-en").setAttribute("aria-pressed",String(lang==="en"));document.getElementById("language-id").setAttribute("aria-pressed",String(lang==="id"));document.querySelectorAll(".step").forEach((el,i)=>el.querySelector(".step-label").textContent=data.lessons[lang][i].title);document.getElementById("toast").hidden=true;showLesson(current);showFile(selectedFile);sendLanguage()}
function showLesson(index,scroll=false){current=index;const lesson=data.lessons[language][index];document.getElementById("lesson-kicker").textContent=String(index+1).padStart(2,"0")+" / "+lesson.label;document.getElementById("lesson-title").textContent=lesson.title;document.getElementById("lesson-subtitle").textContent=lesson.subtitle;document.getElementById("lesson-body").innerHTML=lesson.body;document.getElementById("previous").disabled=index===0;document.getElementById("complete").textContent=index===7?(completed.has(index)?t("finished"):t("finish")):t("continue");document.querySelectorAll(".step").forEach((el,i)=>{el.classList.toggle("active",i===index);el.classList.toggle("done",completed.has(i));el.querySelector(".step-number").textContent=completed.has(i)?"✓":String(i+1).padStart(2,"0");if(i===index)el.setAttribute("aria-current","step");else el.removeAttribute("aria-current")});document.querySelectorAll(".qa-check").forEach((el,i)=>{el.checked=qaDone.has(i);el.addEventListener("change",()=>{el.checked?qaDone.add(i):qaDone.delete(i);updateQA()})});updateQA();const base=document.getElementById("lab-base"),growth=document.getElementById("lab-growth");if(base){base.value=labState.base;growth.value=labState.growth;updateLab()}if(scroll)document.querySelector(".lesson-card").scrollIntoView({behavior:"smooth",block:"start"})}
function updateQA(){const el=document.getElementById("qa-count");if(el)el.textContent=qaDone.size+" / 7 "+t("checks")}
function updateLab(){const baseEl=document.getElementById("lab-base"),growthEl=document.getElementById("lab-growth");if(!baseEl)return;labState.base=baseEl.value;labState.growth=growthEl.value;const base=Number(baseEl.value),growth=Number(growthEl.value);const target=document.getElementById("lab-prices");target.replaceChildren();if(!Number.isFinite(base)||base<1||base>1000||!Number.isFinite(growth)||growth<1||growth>3){target.textContent=t("labError");return}for(let level=0;level<4;level++){const cell=document.createElement("div"),label=document.createElement("span"),price=document.createElement("strong");label.textContent=t("level")+" "+level;price.textContent=String(Math.ceil(base*growth**level));cell.append(label,price);target.append(cell)}}
function showFile(name){selectedFile=name;const text=data.sources[language][name];document.getElementById("source-filename").textContent=name+" · "+text.split("\n").length+" "+t("lines")+(name==="main.ts"?" · "+t("optional"):"");document.getElementById("source-code").textContent=text;document.querySelectorAll(".tab").forEach(el=>{const active=el.dataset.file===name;el.classList.toggle("active",active);el.setAttribute("aria-selected",String(active));el.tabIndex=active?0:-1});document.getElementById("source-panel").setAttribute("aria-labelledby","tab-"+Object.keys(data.sources[language]).indexOf(name))}
data.lessons.en.forEach((lesson,index)=>{const button=document.createElement("button");button.className="step";const number=document.createElement("span"),label=document.createElement("span");number.className="step-number";label.className="step-label";number.textContent=String(index+1).padStart(2,"0");label.textContent=lesson.title;button.append(number,label);button.addEventListener("click",()=>showLesson(index,true));document.getElementById("steps").append(button)});
Object.keys(data.sources.en).forEach((name,index)=>{const button=document.createElement("button");button.className="tab";button.id="tab-"+index;button.dataset.file=name;button.textContent=name;button.setAttribute("role","tab");button.setAttribute("aria-controls","source-panel");button.addEventListener("click",()=>showFile(name));button.addEventListener("keydown",event=>{if(["ArrowRight","ArrowLeft","Home","End"].includes(event.key)){event.preventDefault();const names=Object.keys(data.sources[language]);const next=event.key==="Home"?0:event.key==="End"?names.length-1:(index+(event.key==="ArrowRight"?1:-1)+names.length)%names.length;showFile(names[next]);document.getElementById("tab-"+next).focus()}});document.getElementById("source-tabs").append(button)});
document.addEventListener("click",event=>{const button=event.target.closest("button");if(!button)return;if(button.dataset.download)download(button.dataset.download);if(button.classList.contains("file-link")){showFile(button.dataset.file);document.getElementById("source").scrollIntoView({behavior:"smooth"})}});
document.addEventListener("input",event=>{if(["lab-base","lab-growth"].includes(event.target.id))updateLab()});
document.getElementById("previous").addEventListener("click",()=>showLesson(Math.max(0,current-1),true));
document.getElementById("complete").addEventListener("click",()=>{completed.add(current);const count=completed.size;document.getElementById("progress-text").textContent=count+" / 8";document.getElementById("progress-fill").style.width=count/8*100+"%";document.querySelector(".progress-track").setAttribute("aria-valuenow",String(count));if(current===7){notify(t(count===8?"allDone":"lessonDone"));showLesson(current)}else showLesson(current+1,true)});
document.getElementById("language-en").addEventListener("click",()=>setLanguage("en"));document.getElementById("language-id").addEventListener("click",()=>setLanguage("id"));
document.getElementById("copy-source").addEventListener("click",async()=>{try{if(!navigator.clipboard)throw new Error("unavailable");await navigator.clipboard.writeText(data.sources[language][selectedFile]);notify(t("copied"))}catch{const range=document.createRange();range.selectNodeContents(document.getElementById("source-code"));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);notify(t("copyFallback"))}});
document.getElementById("download-source").addEventListener("click",()=>downloadBlob(new Blob([data.sources[language][selectedFile]],{type:"text/plain;charset=utf-8"}),selectedFile));
document.getElementById("game-frame").addEventListener("load",sendLanguage);
document.getElementById("game-frame").srcdoc=data.games.en;
setLanguage("en");
</script></body></html>
